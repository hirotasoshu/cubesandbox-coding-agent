name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      codex_version:
        description: Codex npm version
        required: false
        default: "0.147.0"
      opencode_version:
        description: OpenCode npm version
        required: false
        default: "1.18.16"
      claude_code_version:
        description: Claude Code npm version
        required: false
        default: "2.1.228"
      deepseek_harness_version:
        description: DeepSeek Harness npm version
        required: false
        default: "0.1.0-rc.7"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CODEX_VERSION=${{ inputs.codex_version || '0.147.0' }}
            OPENCODE_VERSION=${{ inputs.opencode_version || '1.18.16' }}
            CLAUDE_CODE_VERSION=${{ inputs.claude_code_version || '2.1.228' }}
            DEEPSEEK_HARNESS_VERSION=${{ inputs.deepseek_harness_version || '0.1.0-rc.7' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
